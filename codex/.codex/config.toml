# ──────────────────────────────────────────────────────────────
#        C O D E X   C L I   &   I D E   C O N F I G 
# ──────────────────────────────────────────────────────────────

model = "gpt-5.3-codex"
model_reasoning_effort = "high"
personality = "pragmatic"

[notice]
hide_gpt5_1_migration_prompt = true

[notice.model_migrations]
"gpt-5.1-codex-max" = "gpt-5.2-codex"


### Server Configurations
# [mcp_servers.serena]
# command = "uvx"
# args = [
#   "--from",
#   "git+https://github.com/oraios/serena",
#   "serena",
#   "start-mcp-server",
#   "--context",
#   "codex",
# ]

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"

[mcp_servers.chrome-devtools]
command = "npx"
args = ["chrome-devtools-mcp@latest", "--headless", "--isolated"]

[mcp_servers.fetch]
command = "uvx"
args = ["mcp-server-fetch"]


[mcp_servers.filesystem]
command = "npx"
args = [
  "-y",
  "@modelcontextprotocol/server-filesystem",
  "/home/emiel/Dropbox/projects",
  "/home/emiel/.config/nvim",
  "/home/emiel/.dotfiles",
]

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_TOKEN"

[mcp_servers.perplexity]
command = "env"
args = [
  "PERPLEXITY_API_KEY=$PERPLEXITY_API_KEY",
  "npx",
  "-y",
  "@perplexity-ai/mcp-server",
]

[mcp_servers.task_master]
command = "env"
args = [
  "PERPLEXITY_API_KEY=$PERPLEXITY_API_KEY",
  "npx",
  "-y",
  "--package=task-master-ai",
  "task-master-ai",
]


# ──────────────────────────────────────────────────────────────
#                     T R U S T   M O D E L
# ──────────────────────────────────────────────────────────────

[projects."/home/emiel/projects"]
trust_level = "trusted"

[projects."/home/emiel/.config/nvim"]
trust_level = "trusted"

[projects."/home/emiel/.codex"]
trust_level = "trusted"

[projects."/home/emiel/.dotfiles"]
trust_level = "trusted"

[projects."/home/emiel/Dropbox/Vault"]
trust_level = "trusted"

[projects."/home/emiel"]
trust_level = "untrusted"

[projects."/home/emiel/Dropbox/projects"]
trust_level = "trusted"

[projects."/home/emiel/Dropbox/projects/CS50web"]
trust_level = "trusted"

[projects."/home/emiel/.dotfiles/.git/modules/nvim/.config"]
trust_level = "trusted"

[projects."/home/emiel/Dropbox/projects/tests"]
trust_level = "trusted"

[projects."/home/emiel/.local/share/mise/installs/node/25.6.1/bin"]
trust_level = "trusted"
