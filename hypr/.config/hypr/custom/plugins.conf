# Disabled for now: hyprbars is triggering a Hyprland v0.54.3 crash on lid/monitor modeset.
# Re-enable after updating Hyprland or testing a fixed plugin/core build.
# exec-once = hyprpm reload -n

source = ~/.config/omarchy/current/theme/hyprbars.conf

plugin {
    hyprbars {
        enabled = false

        bar_height = 25
        bar_color = $hyprbarBackground
        col.text = $hyprbarForeground
        bar_text_size = 11
        bar_text_font = JetBrainsMono Nerd Font Mono Bold
        bar_text_align = center
        bar_precedence_over_border = true

        hyprbars-button = $hyprbarClose, 15, , hyprctl dispatch killactive
        hyprbars-button = $hyprbarFullscreen, 15, , hyprctl dispatch fullscreen 1
        hyprbars-button = $hyprbarFloat, 15, , hyprctl dispatch togglefloating
    }
}

# Hide Hyprbars on browsers that already draw their own chrome
# windowrule = hyprbars:no_bar on, match:tag firefox-based-browser
# windowrule = hyprbars:no_bar on, match:tag chromium-based-browser

# Keep floating terminals opaque so Hyprbars stay solid over background content
windowrule = opacity 1 1, match:tag terminal, match:float true

# Keep terminals fully opaque so Hyprbars and terminal backgrounds stay solid
# windowrule = opacity 1 1, match:tag terminal
