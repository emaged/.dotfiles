# Always forward this computer's own agent to the two trusted computers.
# This also prevents a return connection from forwarding an agent in a loop.
Host omarchy devtop omarchy.tail2cf8dd.ts.net omarchy.tail2cf8dd.ts.net. devtop.tail2cf8dd.ts.net devtop.tail2cf8dd.ts.net. 100.87.106.106 100.74.195.93 fd7a:115c:a1e0::112f:6a6c fd7a:115c:a1e0::8b2f:c35e
    IdentityAgent ~/.1password/agent.sock
    ForwardAgent ~/.1password/agent.sock

# These tests only inspect session variables; they never contact an agent.
# agent-use local explicitly overrides the default for an incoming SSH shell.
Match exec "test \"${DOTFILES_AGENT_CHOICE:-}\" != local && { test -n \"${DOTFILES_AGENT_CHOICE:-}\" || test -n \"${SSH_CONNECTION:-}\"; }"
    IdentityAgent SSH_AUTH_SOCK
    IdentityFile none
    AddKeysToAgent no

Match exec "test \"${DOTFILES_AGENT_CHOICE:-}\" = local || { test -z \"${DOTFILES_AGENT_CHOICE:-}\" && test -z \"${SSH_CONNECTION:-}\"; }"
    IdentityAgent ~/.1password/agent.sock

Host *
