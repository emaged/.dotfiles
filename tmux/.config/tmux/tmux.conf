# set prefix
unbind C-b
set -g prefix C-Space
bind -N "Send prefix" C-Space send-prefix

# Reload config
unbind q
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"
bind -N "Display pane numbers" Q display-panes

# clear screen binding, vim-tmux-navigator fix
bind -N "Clear screen" C-l send-keys 'C-l'

# pane controls
bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" -n M-Escape kill-pane

bind -N "Split pane vertically" h split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" v split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane

# Focus panes without the prefix.
bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D

# Resize panes without the prefix.
bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5

bind -N "Swap pane left" -n S-Left if -F "#{pane_at_left}" "" "swap-pane -d -t '.{left-of}'"
bind -N "Swap pane right" -n S-Right if -F "#{pane_at_right}" "" "swap-pane -d -t '.{right-of}'"
bind -N "Swap pane up" -n S-Up if -F "#{pane_at_top}" "" "swap-pane -d -t '.{up-of}'"
bind -N "Swap pane down" -n S-Down if -F "#{pane_at_bottom}" "" "swap-pane -d -t '.{down-of}'"

bind -N "Swap panes by ID" S command-prompt -p "Swap: from pane ID" "command-prompt -p 'Swap: to pane ID' 'swap-pane -s %% -t %%'"
bind -N "Join panes by ID" J command-prompt -p "join pane ID" "command-prompt -p 'with pane ID' 'join-pane -h -s %% -t %%'"

# Window navigation
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k kill-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# swap windows left or right
bind -N "Swap window left" "<" swap-window -d -t -1
bind -N "Swap window right" ">" swap-window -d -t +1

# Easier and faster switching between next/prev window
bind -N "Previous window" C-p previous-window
bind -N "Next window" C-n next-window

# Session controls
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n

bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# general settings
# set color options
set -g default-terminal "tmux-256color"
set -as terminal-features '*:RGB'
set -as terminal-features 'xterm*:extkeys'
# enable mouse support
set -g mouse on
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# fixes bug with neovim
set -g focus-events on
# clipboard
set -s set-clipboard on
# same keys as ghostty?
set -g extended-keys always
set -g extended-keys-format csi-u
# scrollbars!
set -g pane-scrollbars on # this is buggy in neovim cmdline when trying to copy
# set -g detach-on-destroy off # annoying when jumping between sessions

### tmux-sensible recommended settings ###
# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0
# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000
# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000
# Emacs key bindings in tmux command prompt (prefix + :) are better than
# vi keys, even for vim users
set -g status-keys emacs
# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# yazi image settings
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# set -g @plugin 'tmux-plugins/tmux-copycat'
# set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'tmux-plugins/tmux-open'

set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'jaclu/tmux-menus'

## Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_date_time_text " %d-%m %H:%M"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# status bar
# set status bar position
set -g status-position top
# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5
# Make the status line pretty and add some modules
set -g status-left-length 30
set -g status-right-length 50
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
if-shell '[ -d /sys/class/power_supply/BAT0 ] || [ -d /sys/class/power_supply/BAT1 ]' \
  "set -agF status-right '#{E:@catppuccin_status_battery}'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# bindings that are overwritten by plugins #
# copy-mode-vi
set-window-option -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection

# disable "release mouse drag to copy and exit copy-mode", ref: https://github.com/tmux/tmux/issues/140
unbind-key -T copy-mode-vi MouseDragEnd1Pane

# since MouseDragEnd1Pane neither exit copy-mode nor clear selection now,
# let single click do selection clearing for us.
bind-key -N "Clear selection" -T copy-mode-vi MouseDown1Pane select-pane\; send-keys -X clear-selection

# Restore Escape in copy-mode-vi
bind -N "Exit copy mode" -T copy-mode-vi Escape send -X cancel

# last window
bind -N "Last window" l last-window

# toggle term, conflicts with vim tumx navigator which selects last active window
bind-key -N "Toggle terminal (Ctrl+Backslash)" -n 'C-\' run-shell -b "${HOME}/.local/scripts/tmux-toggle-term"

set -g status-style bg=default

bind-key -N "Open sessionizer" -r M-f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"
# long running sessions
# bind-key -r M-l run-shell "tmux neww tmux-sessionizer -s 0"
# bind-key -r M-o run-shell "tmux neww tmux-sessionizer -s 1"
# bind-key -r M-p run-shell "tmux neww tmux-sessionizer -s 2"
# bind-key -r M-r run-shell "tmux neww tmux-sessionizer -s 3"

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
