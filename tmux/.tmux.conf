unbind r
bind r source-file ~/.tmux.conf

# set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind Space last-window

# fixes bug with neovim?
set -g focus-events on

# clipboard
set -s set-clipboard on

# same keys as ghostty?
set -g extended-keys on
# allow csi-u key combinations like <C-.>
# set -g extended-keys-format csi-u

# set color options
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# scrollbars!
set -g pane-scrollbars on # this is buggy in neovim cmdline when trying to copy

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# enable mouse support
set -g mouse on

# set status bar position
set-option -g status-position top 

### tmux-sensible recommended settings ###
# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Emacs key bindings in tmux command prompt (prefix + :) are better than
# vi keys, even for vim users
set -g status-keys emacs

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5


# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# automatically restore last tmux session
# set -g @continuum-restore 'on'

# yazi image settings
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

### keybindings ### 
set-window-option -g mode-keys vi
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window


# swap windows left or right
bind "<" swap-window -d -t -1
bind ">" swap-window -d -t +1

#flipping the orientation of the current pane with the pane <arrow-way>-of
bind -n S-Left  if -F "#{pane_at_left}"  "" "move-pane     -t '.{left-of}'"
bind -n S-Right if -F "#{pane_at_right}" "" "move-pane     -t '.{right-of}'"
bind -n S-Up    if -F "#{pane_at_top}"   "" "move-pane -h  -t '.{up-of}'"
bind -n S-Down  if -F "#{pane_at_bottom}" "" "move-pane -h -t '.{down-of}'"

bind -n M-Left  if -F "#{pane_at_left}"   "" "swap-pane -d -t '.{left-of}'"
bind -n M-Right if -F "#{pane_at_right}"  "" "swap-pane -d -t '.{right-of}'"
bind -n M-Up    if -F "#{pane_at_top}"    "" "swap-pane -d -t '.{up-of}'"
bind -n M-Down  if -F "#{pane_at_bottom}" "" "swap-pane -d -t '.{down-of}'"

bind j choose-tree -swZ # weird highlight bug
bind S command-prompt -p "Swap: from pane ID" "command-prompt -p 'Swap: to pane ID' 'swap-pane -s %% -t %%'"
bind J command-prompt -p "join pane ID" "command-prompt -p 'with pane ID' 'join-pane -h -s %% -t %%'"

bind-key -r M-f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
# long running sessions
# bind-key -r M-l run-shell "tmux neww tmux-sessionizer -s 0"
# bind-key -r M-o run-shell "tmux neww tmux-sessionizer -s 1"
# bind-key -r M-p run-shell "tmux neww tmux-sessionizer -s 2"
# bind-key -r M-r run-shell "tmux neww tmux-sessionizer -s 3"

## Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_date_time_text " %d-%m %H:%M"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'

set -g @plugin 'jaclu/tmux-menus'

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Make the status line pretty and add some modules
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
# set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection

# disable "release mouse drag to copy and exit copy-mode", ref: https://github.com/tmux/tmux/issues/140
unbind-key -T copy-mode-vi MouseDragEnd1Pane

# since MouseDragEnd1Pane neither exit copy-mode nor clear selection now,
# let single click do selection clearing for us.
bind-key -T copy-mode-vi MouseDown1Pane select-pane\; send-keys -X clear-selection

# this line changes the default binding of MouseDrag1Pane, the only difference
# is that we use `copy-mode -eM` instead of `copy-mode -M`, so that WheelDownPane
# can trigger copy-mode to exit when copy-mode is entered by MouseDrag1Pane
bind -n MouseDrag1Pane if -Ft= '#{mouse_any_flag}' 'if -Ft= \"#{pane_in_mode}\" \"copy-mode -eM\" \"send-keys -M\"' 'copy-mode -eM'

# Restore Escape in copy-mode-vi
bind -T copy-mode-vi Escape send -X cancel

set -g status-style bg=default

